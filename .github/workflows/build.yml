name: Build profile

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:
  push:
    paths: ['data/stats.json', 'scripts/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets data/contributions.json
          git diff --cached --quiet || { git commit -m 'Refresh profile assets'; git push; }
